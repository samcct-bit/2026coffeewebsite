name = "gsk-groq-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# FIREBASE_PROJECT_ID 已存在為 Secret，避免同名 vars 衝突。

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "100101"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "100102"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "100103"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
head_sampling_rate = 1

# [vars]
# You can put non-sensitive environment variables here

# Note: GROQ_API_KEY should be added as a Secret via:
#   npx wrangler secret put GROQ_API_KEY
#
# Note: PASSWORD_HASH should be added as a Secret via:
#   npx wrangler secret put PASSWORD_HASH
#   (輸入 SHA-256 hash 字串，不要輸入明文密碼)
#
# 限流使用上方原生 binding；不刪除帳號內既有 KV namespace。
# 登入另需 FIREBASE_CLIENT_EMAIL、FIREBASE_PRIVATE_KEY、FIREBASE_PROJECT_ID。
